<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookDucks</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./api.js"></script>
    <script type="module" src="./index.js"></script>
    <script type="module" src="./login.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
    />
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <header>
      <h1>Lilla Bokshoppen</h1>
      <div id="user-controls"></div>
    </header>

    <main>
      <section id="books-section">
        <h2>Månadens böcker</h2>
        <div id="books-container"></div>
      </section>
    </main>

    <dialog id="login-modal" class="modal" aria-labelledby="login-title">
      <div class="modal-content">
        <button type="button" class="close" aria-label="Stäng">&times;</button>
        <h2 id="login-title">Logga in</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="email">E-post</label>
            <input type="email" id="email" placeholder="Din e-post" required autofocus />
          </div>
          <div class="form-group">
            <label for="password">Lösenord</label>
            <input type="password" id="password" placeholder="Ditt lösenord" required />
          </div>
          <p class="forgot-password"><a href="#">Glömt ditt lösenord?</a></p>
          <button type="submit" class="btn btn-primary">Logga in</button>
        </form>
        <div class="modal-footer">
          <p>Är du ny här? <a href="#" id="show-register">Registrera dig</a></p>
        </div>
      </div>
    </dialog>

    <dialog id="register-modal" class="modal" aria-labelledby="register-title">
      <div class="modal-content">
        <button type="button" class="close" aria-label="Stäng">&times;</button>
        <h2 id="register-title">Skapa ett nytt konto</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="register-username">Användarnamn</label>
            <input type="text" id="register-username" placeholder="Välj ett användarnamn" required autofocus />
          </div>
          <div class="form-group">
            <label for="register-email">E-post</label>
            <input type="email" id="register-email" placeholder="Din e-post" required />
          </div>
          <div class="form-group">
            <label for="register-password">Lösenord</label>
            <input type="password" id="register-password" placeholder="Välj ett lösenord" required />
          </div>
          <button type="submit" class="btn btn-primary">Registrera</button>
        </form>
        <div class="modal-footer">
          <p>Har du redan ett konto? <a href="#" id="show-login">Logga in</a></p>
        </div>
      </div>
    </dialog>
  </body>
</html>
